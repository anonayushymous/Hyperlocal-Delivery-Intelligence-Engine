version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: delivery_postgres_db
    restart: always
    environment:
      POSTGRES_USER: hyperlocal_user
      POSTGRES_PASSWORD: hyperlocal_pass
      POSTGRES_DB: hyperlocal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery_fastapi_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://hyperlocal_user:hyperlocal_pass@db:5432/hyperlocal_db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery_streamlit_ui
    restart: always
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    ports:
      - "8501:8501"

volumes:
  postgres_data: