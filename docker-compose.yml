version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: hyperlocal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hyperlocal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hyperlocal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperlocal_engine_app
    restart: on-failure
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: hyperlocal_db
    ports:
      - "8501:8501"
    volumes:
      - .:/app

volumes:
  pgdata:
    driver: local